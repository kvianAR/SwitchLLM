<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SwitchLLM — one endpoint, many models</title>
  <desc id="desc">A purple and cyan illustration showing apps connecting to a SwitchLLM router, which routes to several AI providers.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111126"/><stop offset="1" stop-color="#1a1443"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="160" fill="#7c3aed" opacity=".22" filter="url(#glow)"/>
  <circle cx="140" cy="490" r="150" fill="#06b6d4" opacity=".2" filter="url(#glow)"/>
  <g font-family="Inter, Arial, sans-serif" fill="#f8fafc">
    <g transform="translate(54 51)">
      <rect width="58" height="58" rx="15" fill="#252047"/>
      <path d="M12 22h34m0 0-9-8m9 8-9 8" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M46 38H12m0 0 9-8m-9 8 9 8" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="129" y="90" font-size="36" font-weight="800">SwitchLLM</text>
    <text x="55" y="177" font-size="53" font-weight="800">One API. Many models.</text>
    <text x="57" y="217" font-size="22" fill="#cbd5e1">Route across your connected providers with one local endpoint.</text>
    <rect x="56" y="253" width="313" height="47" rx="23" fill="#372b68"/>
    <text x="78" y="283" font-size="19" font-weight="700" fill="#ddd6fe">OpenAI-compatible /v1</text>
    <rect x="382" y="253" width="185" height="47" rx="23" fill="#174c61"/>
    <text x="407" y="283" font-size="19" font-weight="700" fill="#a5f3fc">Local-first</text>
    <text x="57" y="378" font-size="19" font-weight="700" fill="#c4b5fd">YOUR APPS</text>
    <text x="468" y="378" font-size="19" font-weight="700" fill="#c4b5fd">SMART ROUTER</text>
    <text x="861" y="378" font-size="19" font-weight="700" fill="#c4b5fd">PROVIDERS</text>
    <rect x="56" y="398" width="270" height="100" rx="18" fill="#242040" stroke="#5b4b83"/>
    <text x="81" y="439" font-size="22" font-weight="700">Your project</text>
    <text x="81" y="471" font-size="17" fill="#cbd5e1">CLI · SDK · coding agent</text>
    <path d="M330 448h96" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m414 438 15 10-15 10" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linejoin="round"/>
    <rect x="440" y="398" width="280" height="100" rx="18" fill="#312351" stroke="#a78bfa"/>
    <text x="466" y="439" font-size="22" font-weight="700">SwitchLLM</text>
    <text x="466" y="471" font-size="17" fill="#cbd5e1">auto routing · failover</text>
    <path d="M724 448h95" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m808 438 15 10-15 10" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/>
    <rect x="835" y="398" width="304" height="100" rx="18" fill="#19364c" stroke="#22d3ee"/>
    <text x="862" y="439" font-size="22" font-weight="700">Connected keys</text>
    <text x="862" y="471" font-size="17" fill="#cbd5e1">Gemini · Groq · more</text>
  </g>
</svg>
